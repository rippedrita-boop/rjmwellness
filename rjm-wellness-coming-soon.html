<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RJM Wellness | Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:linear-gradient(135deg,#FCE7EE,#F8D9E3,#FFF7FA);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:'Inter',sans-serif;
    position:relative;
}
.card{
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(12px);
    width:min(90%,650px);
    padding:60px 50px;
    border-radius:28px;
    text-align:center;
    box-shadow:
        0 25px 60px rgba(180,120,145,.18);
    animation:fadeUp 1.2s ease;
    position:relative;
    z-index:1;
}
.logo{
    font-size:58px;
    margin-bottom:20px;
}
h1{
    font-family:'Cormorant Garamond',serif;
    font-size:3.3rem;
    color:#A65978;
    margin-bottom:22px;
    font-weight:600;
}
p{
    font-size:1.2rem;
    color:#555;
    line-height:1.8;
}
.signature{
    margin-top:40px;
    color:#B78595;
    letter-spacing:4px;
    font-size:.85rem;
    text-transform:uppercase;
}
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    filter:blur(5px);
}
.c1{
    width:280px;
    height:280px;
    top:-90px;
    left:-80px;
}
.c2{
    width:220px;
    height:220px;
    bottom:-70px;
    right:-60px;
}
</style>
</head>
<body>
<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="card">
<div class="logo">🌿</div>
<h1>Hi, you're here early!</h1>
<p>
RJM Wellness is currently being thoughtfully created.
<br><br>
We're excited to share a space dedicated to wellness,
growth, and intentional living.
<br><br>
Please check back soon—we can't wait to welcome you.
</p>
<div class="signature">
RJM WELLNESS
</div>
</div>
</body>
</html>
